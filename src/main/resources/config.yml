# SimpMC-Punish
# 专业 Minecraft 处罚管理系统
# 作者: GPT5.5, Minecraft0122, SimpMC

# 绕过权限
# 拥有该权限的玩家不会受到封禁、禁言和踢出影响。
bypass:
  permission: "simpmc-punish.bypass"

# 数据库配置
# Velocity 全网部署必须使用 MySQL；SQLite 仅保留给不安装 Velocity 的单服部署。
database:
  type: "mysql"

  sqlite:
    # 相对于 plugins/SimpMC-Punish 目录的 SQLite 数据库文件名。
    file: "punishments.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "simpmc_punish"
    username: "root"
    password: "password"
    properties:
      useSSL: false
      autoReconnect: true
      characterEncoding: "utf8"

  pool-size: 5

# 缓存配置
cache:
  expiry-minutes: 10
  # 跨服解除禁言的最长同步延迟；禁言缓存会按此周期重新读取数据库。
  mute-expiry-seconds: 5
  # 聊天时缓存未命中后查询共享数据库的最长等待时间。
  mute-check-timeout-ms: 1000
  max-size: 1000
  expiry-check-interval: 60

# 菜单界面内显示的时长预设
# 格式: <数字><单位>，单位支持 s/m/h/d/w/M/y
durations:
  presets:
    - "1h"
    - "6h"
    - "1d"
    - "3d"
    - "7d"
    - "30d"
    - "90d"

# 按玩家被该自定义命令处罚的历史次数递进执行处罚。
# steps 从第 1 次开始匹配；超过最后一档后继续使用最后一档。
# 可用动作: kick、ban、tempban、mute、tempmute、warn、tempwarn。
# 推荐动作只写要替换的指令前缀，玩家和原因会自动继承；也兼容 {player}、{reason} 或 <player>、<reason> 占位符。
escalation:
  commands:
    punish1:
      enabled: false
      permission: "simpmc-punish.escalation.punish1"
      description: "按次数递进处罚"
      usage: "/punish1 <玩家> [原因]"
      steps:
        1: "kick"
        2: "tempban 1h"
        3: "ban"
