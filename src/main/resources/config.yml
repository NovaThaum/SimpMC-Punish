# SimpMC-Punish
# 专业 Minecraft 处罚管理系统
# 作者: GPT5.5, Minecraft0122, SimpMC

# 绕过权限
# 拥有该权限的玩家不会受到封禁、禁言和踢出影响。
bypass:
  permission: "simpmc-punish.bypass"

# 数据库配置
# 数据库类型可选: sqlite, mysql
database:
  type: "sqlite"

  sqlite:
    # 相对于 plugins/SimpMC-Punish 目录的 SQLite 数据库文件名。
    file: "punishments.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "simpmc_punish"
    username: "root"
    password: "password"
    properties:
      useSSL: false
      autoReconnect: true
      characterEncoding: "utf8"

  pool-size: 5

# 缓存配置
cache:
  expiry-minutes: 10
  max-size: 1000
  expiry-check-interval: 60

# 菜单界面内显示的时长预设
# 格式: <数字><单位>，单位支持 s/m/h/d/w/M/y
durations:
  presets:
    - "1h"
    - "6h"
    - "1d"
    - "3d"
    - "7d"
    - "30d"
    - "90d"

# Discord 通知配置
# 开启后会把处罚记录发送到指定 Discord 频道。
discord:
  enabled: false
  notification-url: "请填写 Discord 通知地址"
  batch-interval-seconds: 5
