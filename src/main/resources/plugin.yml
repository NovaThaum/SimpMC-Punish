name: SimpBan
version: '1.0'
main: me.simpmc.simpban.SimpBan
api-version: '1.21'
authors: [ GPT5.5, Minecraft0122, SimpMC ]
description: 面向 Minecraft 服务器的专业处罚管理插件
folia-supported: true
load: STARTUP

commands:
  ban:
    description: 永久封禁玩家
    usage: /ban <player> [reason]
    permission: simpban.ban
  tempban:
    description: 临时封禁玩家
    usage: /tempban <player> <duration> [reason]
    permission: simpban.tempban
  unban:
    description: 解除玩家封禁
    usage: /unban <player>
    permission: simpban.unban
  banip:
    description: 永久封禁玩家 IP（自动解析 IP）
    usage: /banip <player> [reason]
    permission: simpban.banip
  tempbanip:
    description: 临时封禁玩家 IP（自动解析 IP）
    usage: /tempbanip <player> <duration> [reason]
    permission: simpban.tempbanip
  unbanip:
    description: 解除玩家 IP 封禁（自动解析 IP）
    usage: /unbanip <player>
    permission: simpban.unbanip
  mute:
    description: 永久禁言玩家
    usage: /mute <player> [reason]
    permission: simpban.mute
  tempmute:
    description: 临时禁言玩家
    usage: /tempmute <player> <duration> [reason]
    permission: simpban.tempmute
  unmute:
    description: 解除玩家禁言
    usage: /unmute <player>
    permission: simpban.unmute
  muteip:
    description: 永久禁言玩家 IP（自动解析 IP）
    usage: /muteip <player> [reason]
    permission: simpban.muteip
  tempmuteip:
    description: 临时禁言玩家 IP（自动解析 IP）
    usage: /tempmuteip <player> <duration> [reason]
    permission: simpban.tempmuteip
  unmuteip:
    description: 解除玩家 IP 禁言（自动解析 IP）
    usage: /unmuteip <player>
    permission: simpban.unmuteip
  kick:
    description: 将玩家踢出服务器
    usage: /kick <player> [reason]
    permission: simpban.kick
  punish:
    description: 打开玩家处罚 GUI
    usage: /punish <player>
    permission: simpban.punish
  history:
    description: 查看玩家处罚历史
    usage: /history <player>
    permission: simpban.history
  simpban:
    description: SimpBan 管理命令
    usage: /simpban <reload|help>
    permission: simpban.admin
    aliases: [sb]

permissions:
  simpban.ban:
    description: 允许永久封禁玩家
    default: op
  simpban.tempban:
    description: 允许临时封禁玩家
    default: op
  simpban.unban:
    description: 允许解除玩家封禁
    default: op
  simpban.banip:
    description: 允许永久封禁玩家 IP
    default: op
  simpban.tempbanip:
    description: 允许临时封禁玩家 IP
    default: op
  simpban.unbanip:
    description: 允许解除 IP 封禁
    default: op
  simpban.mute:
    description: 允许永久禁言玩家
    default: op
  simpban.tempmute:
    description: 允许临时禁言玩家
    default: op
  simpban.unmute:
    description: 允许解除玩家禁言
    default: op
  simpban.muteip:
    description: 允许永久禁言玩家 IP
    default: op
  simpban.tempmuteip:
    description: 允许临时禁言玩家 IP
    default: op
  simpban.unmuteip:
    description: 允许解除 IP 禁言
    default: op
  simpban.kick:
    description: 允许踢出玩家
    default: op
  simpban.punish:
    description: 允许使用处罚 GUI
    default: op
  simpban.history:
    description: 允许查看处罚历史
    default: op
  simpban.admin:
    description: 允许使用管理命令（重载等）
    default: op
  simpban.help:
    description: 允许查看 SimpBan 帮助
    default: op
  simpban.bypass:
    description: 绕过所有处罚检查
    default: false
  simpban.staff:
    description: SimpBan 工作人员权限组
    default: op
    children:
      simpban.ban: true
      simpban.tempban: true
      simpban.unban: true
      simpban.banip: true
      simpban.tempbanip: true
      simpban.unbanip: true
      simpban.mute: true
      simpban.tempmute: true
      simpban.unmute: true
      simpban.muteip: true
      simpban.tempmuteip: true
      simpban.unmuteip: true
      simpban.kick: true
      simpban.punish: true
      simpban.history: true
      simpban.help: true
