name: SimpMC-Punish
version: '${project.version}'
main: me.simpmc.simpmcpunish.SimpMCPunish
api-version: '1.21'
authors: [ GPT5.5, Minecraft0122, SimpMC ]
description: 面向 Minecraft 服务器的专业处罚管理插件
folia-supported: true
load: STARTUP

commands:
  ban:
    description: 永久封禁玩家
    usage: /ban <玩家> [原因]
    permission: simpmc-punish.ban
  tempban:
    description: 临时封禁玩家
    usage: /tempban <玩家> <时长> [原因]
    permission: simpmc-punish.tempban
  unban:
    description: 解除玩家封禁
    usage: /unban <玩家>
    permission: simpmc-punish.unban
  banip:
    description: 永久封禁玩家 IP（自动解析 IP）
    usage: /banip <玩家> [原因]
    permission: simpmc-punish.banip
  tempbanip:
    description: 临时封禁玩家 IP（自动解析 IP）
    usage: /tempbanip <玩家> <时长> [原因]
    permission: simpmc-punish.tempbanip
  unbanip:
    description: 解除玩家 IP 封禁（自动解析 IP）
    usage: /unbanip <玩家>
    permission: simpmc-punish.unbanip
  mute:
    description: 永久禁言玩家
    usage: /mute <玩家> [原因]
    permission: simpmc-punish.mute
  tempmute:
    description: 临时禁言玩家
    usage: /tempmute <玩家> <时长> [原因]
    permission: simpmc-punish.tempmute
  unmute:
    description: 解除玩家禁言
    usage: /unmute <玩家>
    permission: simpmc-punish.unmute
  muteip:
    description: 永久禁言玩家 IP（自动解析 IP）
    usage: /muteip <玩家> [原因]
    permission: simpmc-punish.muteip
  tempmuteip:
    description: 临时禁言玩家 IP（自动解析 IP）
    usage: /tempmuteip <玩家> <时长> [原因]
    permission: simpmc-punish.tempmuteip
  unmuteip:
    description: 解除玩家 IP 禁言（自动解析 IP）
    usage: /unmuteip <玩家>
    permission: simpmc-punish.unmuteip
  kick:
    description: 将玩家踢出服务器
    usage: /kick <玩家> [原因]
    permission: simpmc-punish.kick
  punish:
    description: 打开玩家处罚菜单界面
    usage: /punish <玩家>
    permission: simpmc-punish.punish
  history:
    description: 查看玩家处罚历史
    usage: /history <玩家>
    permission: simpmc-punish.history
  banlist:
    description: 查看当前生效中的封禁列表
    usage: /banlist [页码]
    permission: simpmc-punish.banlist
  simpmc-punish:
    description: SimpMC-Punish 管理命令
    usage: /simpmc-punish <重载|帮助>
    permission: simpmc-punish.admin
    aliases: [smp]

permissions:
  simpmc-punish.ban:
    description: 允许永久封禁玩家
    default: op
  simpmc-punish.tempban:
    description: 允许临时封禁玩家
    default: op
  simpmc-punish.unban:
    description: 允许解除玩家封禁
    default: op
  simpmc-punish.banip:
    description: 允许永久封禁玩家 IP
    default: op
  simpmc-punish.tempbanip:
    description: 允许临时封禁玩家 IP
    default: op
  simpmc-punish.unbanip:
    description: 允许解除 IP 封禁
    default: op
  simpmc-punish.mute:
    description: 允许永久禁言玩家
    default: op
  simpmc-punish.tempmute:
    description: 允许临时禁言玩家
    default: op
  simpmc-punish.unmute:
    description: 允许解除玩家禁言
    default: op
  simpmc-punish.muteip:
    description: 允许永久禁言玩家 IP
    default: op
  simpmc-punish.tempmuteip:
    description: 允许临时禁言玩家 IP
    default: op
  simpmc-punish.unmuteip:
    description: 允许解除 IP 禁言
    default: op
  simpmc-punish.kick:
    description: 允许踢出玩家
    default: op
  simpmc-punish.punish:
    description: 允许使用处罚菜单界面
    default: op
  simpmc-punish.history:
    description: 允许查看处罚历史
    default: op
  simpmc-punish.banlist:
    description: 允许查看当前生效中的封禁列表
    default: op
  simpmc-punish.admin:
    description: 允许使用管理命令（重载等）
    default: op
  simpmc-punish.help:
    description: 允许查看 SimpMC-Punish 帮助
    default: op
  simpmc-punish.bypass:
    description: 绕过所有处罚检查
    default: false
  simpmc-punish.staff:
    description: SimpMC-Punish 工作人员权限组
    default: op
    children:
      simpmc-punish.ban: true
      simpmc-punish.tempban: true
      simpmc-punish.unban: true
      simpmc-punish.banip: true
      simpmc-punish.tempbanip: true
      simpmc-punish.unbanip: true
      simpmc-punish.mute: true
      simpmc-punish.tempmute: true
      simpmc-punish.unmute: true
      simpmc-punish.muteip: true
      simpmc-punish.tempmuteip: true
      simpmc-punish.unmuteip: true
      simpmc-punish.kick: true
      simpmc-punish.punish: true
      simpmc-punish.history: true
      simpmc-punish.banlist: true
      simpmc-punish.help: true
