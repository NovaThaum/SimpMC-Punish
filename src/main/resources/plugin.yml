name: SimpBan
version: '${project.version}'
main: me.simpmc.simpban.SimpBan
api-version: '1.21'
authors: [ GPT5.5, Minecraft0122, SimpMC ]
description: 面向 Minecraft 服务器的专业处罚管理插件
folia-supported: true
load: STARTUP

commands:
  ban:
    description: 永久封禁玩家
    usage: /ban <玩家> [原因]
    permission: simpban.ban
  tempban:
    description: 临时封禁玩家
    usage: /tempban <玩家> <时长> [原因]
    permission: simpban.tempban
  unban:
    description: 解除玩家封禁
    usage: /unban <玩家>
    permission: simpban.unban
  banip:
    description: 永久封禁玩家 IP（自动解析 IP）
    usage: /banip <玩家> [原因]
    permission: simpban.banip
  tempbanip:
    description: 临时封禁玩家 IP（自动解析 IP）
    usage: /tempbanip <玩家> <时长> [原因]
    permission: simpban.tempbanip
  unbanip:
    description: 解除玩家 IP 封禁（自动解析 IP）
    usage: /unbanip <玩家>
    permission: simpban.unbanip
  mute:
    description: 永久禁言玩家
    usage: /mute <玩家> [原因]
    permission: simpban.mute
  tempmute:
    description: 临时禁言玩家
    usage: /tempmute <玩家> <时长> [原因]
    permission: simpban.tempmute
  unmute:
    description: 解除玩家禁言
    usage: /unmute <玩家>
    permission: simpban.unmute
  muteip:
    description: 永久禁言玩家 IP（自动解析 IP）
    usage: /muteip <玩家> [原因]
    permission: simpban.muteip
  tempmuteip:
    description: 临时禁言玩家 IP（自动解析 IP）
    usage: /tempmuteip <玩家> <时长> [原因]
    permission: simpban.tempmuteip
  unmuteip:
    description: 解除玩家 IP 禁言（自动解析 IP）
    usage: /unmuteip <玩家>
    permission: simpban.unmuteip
  kick:
    description: 将玩家踢出服务器
    usage: /kick <玩家> [原因]
    permission: simpban.kick
  punish:
    description: 打开玩家处罚菜单界面
    usage: /punish <玩家>
    permission: simpban.punish
  history:
    description: 查看玩家处罚历史
    usage: /history <玩家>
    permission: simpban.history
  banlist:
    description: 查看当前生效中的封禁列表
    usage: /banlist [页码]
    permission: simpban.banlist
  simpban:
    description: SimpBan 管理命令
    usage: /simpban <重载|帮助>
    permission: simpban.admin
    aliases: [sb]

permissions:
  simpban.ban:
    description: 允许永久封禁玩家
    default: op
  simpban.tempban:
    description: 允许临时封禁玩家
    default: op
  simpban.unban:
    description: 允许解除玩家封禁
    default: op
  simpban.banip:
    description: 允许永久封禁玩家 IP
    default: op
  simpban.tempbanip:
    description: 允许临时封禁玩家 IP
    default: op
  simpban.unbanip:
    description: 允许解除 IP 封禁
    default: op
  simpban.mute:
    description: 允许永久禁言玩家
    default: op
  simpban.tempmute:
    description: 允许临时禁言玩家
    default: op
  simpban.unmute:
    description: 允许解除玩家禁言
    default: op
  simpban.muteip:
    description: 允许永久禁言玩家 IP
    default: op
  simpban.tempmuteip:
    description: 允许临时禁言玩家 IP
    default: op
  simpban.unmuteip:
    description: 允许解除 IP 禁言
    default: op
  simpban.kick:
    description: 允许踢出玩家
    default: op
  simpban.punish:
    description: 允许使用处罚菜单界面
    default: op
  simpban.history:
    description: 允许查看处罚历史
    default: op
  simpban.banlist:
    description: 允许查看当前生效中的封禁列表
    default: op
  simpban.admin:
    description: 允许使用管理命令（重载等）
    default: op
  simpban.help:
    description: 允许查看 SimpBan 帮助
    default: op
  simpban.bypass:
    description: 绕过所有处罚检查
    default: false
  simpban.staff:
    description: SimpBan 工作人员权限组
    default: op
    children:
      simpban.ban: true
      simpban.tempban: true
      simpban.unban: true
      simpban.banip: true
      simpban.tempbanip: true
      simpban.unbanip: true
      simpban.mute: true
      simpban.tempmute: true
      simpban.unmute: true
      simpban.muteip: true
      simpban.tempmuteip: true
      simpban.unmuteip: true
      simpban.kick: true
      simpban.punish: true
      simpban.history: true
      simpban.banlist: true
      simpban.help: true
