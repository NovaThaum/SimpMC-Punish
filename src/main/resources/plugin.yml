name: SimpBan
version: '1.0'
main: me.simpfun.simpban.SimpBan
api-version: '1.21'
authors: [ GPT5.5, Minecraft0122, SimpFun ]
description: Professional punishment management system for Minecraft servers
folia-supported: true
load: STARTUP

commands:
  ban:
    description: Permanently ban a player
    usage: /ban <player> [reason]
    permission: simpban.ban
  tempban:
    description: Temporarily ban a player
    usage: /tempban <player> <duration> [reason]
    permission: simpban.tempban
  unban:
    description: Unban a player
    usage: /unban <player>
    permission: simpban.unban
  banip:
    description: Permanently IP ban a player (auto-resolves IP)
    usage: /banip <player> [reason]
    permission: simpban.banip
  tempbanip:
    description: Temporarily IP ban a player (auto-resolves IP)
    usage: /tempbanip <player> <duration> [reason]
    permission: simpban.tempbanip
  unbanip:
    description: Unban a player's IP (auto-resolves IP)
    usage: /unbanip <player>
    permission: simpban.unbanip
  mute:
    description: Permanently mute a player
    usage: /mute <player> [reason]
    permission: simpban.mute
  tempmute:
    description: Temporarily mute a player
    usage: /tempmute <player> <duration> [reason]
    permission: simpban.tempmute
  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: simpban.unmute
  muteip:
    description: Permanently IP mute a player (auto-resolves IP)
    usage: /muteip <player> [reason]
    permission: simpban.muteip
  tempmuteip:
    description: Temporarily IP mute a player (auto-resolves IP)
    usage: /tempmuteip <player> <duration> [reason]
    permission: simpban.tempmuteip
  unmuteip:
    description: Unmute a player's IP (auto-resolves IP)
    usage: /unmuteip <player>
    permission: simpban.unmuteip
  kick:
    description: Kick a player from the server
    usage: /kick <player> [reason]
    permission: simpban.kick
  punish:
    description: Open the punishment GUI for a player
    usage: /punish <player>
    permission: simpban.punish
  history:
    description: View punishment history
    usage: /history <player>
    permission: simpban.history
  simpban:
    description: SimpBan admin commands
    usage: /simpban <reload>
    permission: simpban.admin
    aliases: [sb]

permissions:
  simpban.ban:
    description: Allows permanent banning
    default: op
  simpban.tempban:
    description: Allows temporary banning
    default: op
  simpban.unban:
    description: Allows unbanning players
    default: op
  simpban.banip:
    description: Allows permanent IP banning
    default: op
  simpban.tempbanip:
    description: Allows temporary IP banning
    default: op
  simpban.unbanip:
    description: Allows unbanning IPs
    default: op
  simpban.mute:
    description: Allows permanent muting
    default: op
  simpban.tempmute:
    description: Allows temporary muting
    default: op
  simpban.unmute:
    description: Allows unmuting players
    default: op
  simpban.muteip:
    description: Allows permanent IP muting
    default: op
  simpban.tempmuteip:
    description: Allows temporary IP muting
    default: op
  simpban.unmuteip:
    description: Allows unmuting IPs
    default: op
  simpban.kick:
    description: Allows kicking players
    default: op
  simpban.punish:
    description: Allows using punishment GUI
    default: op
  simpban.history:
    description: Allows viewing punishment history
    default: op
  simpban.admin:
    description: Admin commands (reload, etc.)
    default: op
  simpban.help:
    description: Allows viewing SimpBan help
    default: op
  simpban.bypass:
    description: Bypass all punishments
    default: false
  simpban.staff:
    description: All staff permissions
    default: op
    children:
      simpban.ban: true
      simpban.tempban: true
      simpban.unban: true
      simpban.banip: true
      simpban.tempbanip: true
      simpban.unbanip: true
      simpban.mute: true
      simpban.tempmute: true
      simpban.unmute: true
      simpban.muteip: true
      simpban.tempmuteip: true
      simpban.unmuteip: true
      simpban.kick: true
      simpban.punish: true
      simpban.history: true
      simpban.help: true
