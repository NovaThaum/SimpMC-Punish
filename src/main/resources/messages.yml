prefix: "&8[&c&lSimpMC-Punish&8]&r "

punishments:
  ban:
    # behavior.vanilla-ban-components=false 时使用此模板。
    screen: |-
      &c&l你已被封禁

      &7玩家: &f{player}
      &7执行者: &f{staff}
      &7原因: &f{reason}
      &7到期: &f{expires}

      &7如需申诉，请联系服务器管理组。
    broadcast:
      enabled: true
      message: "&c{staff} &7封禁了 &c{player} &7原因: &f{reason} &7({duration})"
    success: "&a已封禁 {player}"

  tempban:
    broadcast:
      enabled: true
      message: "&c{staff} &7临时封禁了 &c{player} &7原因: &f{reason} &7({duration})"
    success: "&a已临时封禁 {player}，时长 {duration}"

  unban:
    broadcast:
      enabled: true
      message: "&a{staff} &7解除了 &a{player} &7的封禁"
    success: "&a已解除 {player} 的封禁"

  mute:
    blocked: |
      &c你的发言已被禁止！
      &7原因: &f{reason}
      &7剩余时间: &f{expires}
    applied: "&c你已被 {staff} 禁言！原因: &f{reason} &7到期: &f{expires}"
    broadcast:
      enabled: true
      message: "&e{staff} &7禁言了 &e{player} &7原因: &f{reason} &7({duration})"
    success: "&a已禁言 {player}"

  tempmute:
    broadcast:
      enabled: true
      message: "&e{staff} &7临时禁言了 &e{player} &7原因: &f{reason} &7({duration})"
    success: "&a已临时禁言 {player}，时长 {duration}"

  warn:
    broadcast:
      enabled: true
      message: "&e{staff} &7警告了 &e{player} &7原因: &f{reason}"
    success: "&a已警告 {player}"

  tempwarn:
    broadcast:
      enabled: true
      message: "&e{staff} &7临时警告了 &e{player} &7原因: &f{reason} &7({duration})"
    success: "&a已临时警告 {player}，时长 {duration}"

  unmute:
    broadcast:
      enabled: true
      message: "&a{staff} &7解除了 &a{player} &7的禁言"
    notify: "&a你的禁言已被解除。"
    success: "&a已解除 {player} 的禁言"

  kick:
    screen: |-
      &6&l你已被踢出服务器

      &7执行者: &f{staff}
      &7原因: &f{reason}
    broadcast:
      enabled: true
      message: "&9{staff} &7踢出了 &9{player} &7原因: &f{reason}"
    success: "&a已踢出 {player}"

  banip:
    broadcast:
      enabled: true
      message: "&c{staff} &7封禁了 &c{player} &7的 IP (&f{ip}&7) 原因: &f{reason} &7({duration})"
    success: "&a已封禁 {player} 的 IP ({ip})"

  tempbanip:
    broadcast:
      enabled: true
      message: "&c{staff} &7临时封禁了 &c{player} &7的 IP (&f{ip}&7) 原因: &f{reason} &7({duration})"
    success: "&a已临时封禁 {player} 的 IP ({ip})，时长 {duration}"

  unbanip:
    broadcast:
      enabled: true
      message: "&a{staff} &7解除了 &a{player} &7的 IP 封禁 (&f{ip}&7)"
    success: "&a已解除 {player} 的 IP 封禁"

  muteip:
    broadcast:
      enabled: true
      message: "&e{staff} &7禁言了 &e{player} &7的 IP (&f{ip}&7) 原因: &f{reason} &7({duration})"
    success: "&a已禁言 {player} 的 IP ({ip})"

  tempmuteip:
    broadcast:
      enabled: true
      message: "&e{staff} &7临时禁言了 &e{player} &7的 IP (&f{ip}&7) 原因: &f{reason} &7({duration})"
    success: "&a已临时禁言 {player} 的 IP ({ip})，时长 {duration}"

  unmuteip:
    broadcast:
      enabled: true
      message: "&a{staff} &7解除了 &a{player} &7的 IP 禁言 (&f{ip}&7)"
    success: "&a已解除 {player} 的 IP 禁言"

banlist:
  header: "&8&m---------------- &c&l封禁列表 &8&m---------------- &7第 {page}/{pages} 页，共 {total} 条"
  entry:
    - "&8#{index} &c{target} &8- &f{type}"
    - "&7  执行者: &f{staff} &8| &7剩余: &f{expires} &8| &7封禁时间: &f{created}"
    - "&7  原因: &f{reason}"
  empty: "&7当前没有生效中的封禁。"
  footer: "&8&m-------------------------------------------------- &7使用 &f/banlist <页码> &7翻页"
  invalid-page: "&c页码必须是大于 0 的整数。"
  page-out-of-range: "&c该页不存在，当前共有 {pages} 页。"
  error: "&c读取封禁列表失败，请查看控制台日志。"

errors:
  player-not-found: "&c找不到该玩家。"
  player-not-online: "&c该玩家当前不在线。"
  cannot-punish: "&c你不能处罚该玩家。"
  not-banned: "&c{player} 当前没有被封禁。"
  not-muted: "&c{player} 当前没有被禁言。"
  invalid-duration: "&c时长格式无效！示例: 1h, 30m, 7d。"
  no-permission: "&c你没有权限执行该操作。"

warnings:
  header: "&8&m---------------- &e&l{player} 的当前警告 &8&m---------------- &7共 {total} 条"
  entry:
    - "&8#{id} &e{type} &8| &7执行者: &f{staff}"
    - "&7  原因: &f{reason} &8| &7到期: &f{expires}"
  empty: "&7该玩家当前没有生效中的警告。"
  error: "&c读取警告列表失败，请查看控制台日志。"
  cleared: "&e{staff} &7清除了 &e{player} &7的 &f{count} &7条生效警告"

gui:
  punish:
    title: "&c&l处罚 &8> &e{player}"
    items:
      ban:
        material: BARRIER
        name: "&c&l永久封禁"
        lore:
          - ""
          - "&7永久禁止该玩家进入服务器。"
          - ""
          - "&e点击执行"
      tempban:
        material: CLOCK
        name: "&6&l临时封禁"
        lore:
          - ""
          - "&7按指定时长封禁该玩家。"
          - ""
          - "&e点击选择时长"
      kick:
        material: LEATHER_BOOTS
        name: "&9&l踢出"
        lore:
          - ""
          - "&7将该玩家踢出服务器。"
          - ""
          - "&e点击执行"
      mute:
        material: PAPER
        name: "&e&l永久禁言"
        lore:
          - ""
          - "&7永久禁止该玩家聊天。"
          - ""
          - "&e点击执行"
      tempmute:
        material: WRITABLE_BOOK
        name: "&a&l临时禁言"
        lore:
          - ""
          - "&7按指定时长禁言该玩家。"
          - ""
          - "&e点击选择时长"
      history:
        material: BOOK
        name: "&d&l处罚历史"
        lore:
          - ""
          - "&7查看该玩家的处罚记录。"
          - ""
          - "&e点击查看"
      close:
        material: RED_STAINED_GLASS_PANE
        name: "&c&l关闭"
        lore:
          - ""
          - "&e点击关闭"
      player-head:
        name: "&e{player}"
        lore:
          - ""
          - "&7UUID: &f{uuid}"
          - "&7在线: {online}"
          - ""
          - "&7请选择下方处罚类型。"

  duration:
    title: "&c&l选择时长 &8> &e{player}"
    items:
      glass-pane:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
      back:
        material: ARROW
        name: "&7&l返回"
        lore:
          - ""
          - "&e点击返回"
      permanent:
        material: BEDROCK
        name: "&c&l永久"
        lore:
          - ""
          - "&7将本次处罚设为永久。"
          - ""
          - "&e点击执行"
      custom:
        material: NAME_TAG
        name: "&b&l自定义时长"
        lore:
          - ""
          - "&7在聊天栏输入自定义时长。"
          - "&7示例: 2h30m, 5d"
          - ""
          - "&e点击输入"
      1h:
        material: LIME_DYE
        name: "&a1 小时"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      6h:
        material: YELLOW_DYE
        name: "&e6 小时"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      1d:
        material: ORANGE_DYE
        name: "&61 天"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      3d:
        material: RED_DYE
        name: "&c3 天"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      7d:
        material: PURPLE_DYE
        name: "&51 周"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      30d:
        material: MAGENTA_DYE
        name: "&d30 天"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"
      90d:
        material: BLUE_DYE
        name: "&990 天"
        lore:
          - ""
          - "&7时长: &f{duration}"
          - ""
          - "&e点击执行"

  history:
    title: "&d&l历史记录 &8> &e{player} &7(第 {page} 页)"
    items:
      prev-page:
        material: ARROW
        name: "&a上一页"
        lore:
          - ""
          - "&e点击返回上一页"
      next-page:
        material: ARROW
        name: "&a下一页"
        lore:
          - ""
          - "&e点击进入下一页"
      back:
        material: BARRIER
        name: "&c&l返回处罚菜单"
        lore:
          - ""
          - "&e点击返回"
      player-head:
        name: "&e{player}"
        lore:
          - ""
          - "&7处罚总数: &f{total}"
          - "&7生效中: &f{active}"

input:
  reason:
    header: "&8&m----------------------------------------"
    title: "&c&lSimpMC-Punish &8> &f输入处罚原因"
    target: "&7目标: &e{player}"
    type: "&7类型: {type}"
    duration: "&7时长: &f{duration}"
    instruction: "&7请在聊天栏输入原因，输入 &c取消 &7取消操作。"
    cancelled: "&c已取消处罚。"
    timeout: "&c处罚已取消（输入超时）。"
    no-permission: "&c你没有权限使用该处罚类型。"
    error: "&c执行处罚时出现错误，请查看控制台。"
    loading-history: "&7正在加载处罚历史..."

  custom-duration:
    header: "&8&m----------------------------------------"
    title: "&c&lSimpMC-Punish &8> &f输入自定义时长"
    format-header: "&7格式示例:"
    formats:
      - "&7  &e1h &7= 1 小时"
      - "&7  &e30m &7= 30 分钟"
      - "&7  &e7d &7= 7 天"
      - "&7  &e2w &7= 2 周"
      - "&7  &e1M &7= 1 个月"
      - "&7  &e1y &7= 1 年"
      - "&7  &e2h30m &7= 2 小时 30 分钟"
    instruction: "&7请在聊天栏输入时长，输入 &c取消 &7取消操作。"
    cancelled: "&c已取消时长输入。"
    timeout: "&c已取消时长输入（输入超时）。"
    invalid: "&c时长格式无效！请重试，或输入 &e取消 &c取消操作。"
    success: "&a时长已设置为: &f{duration}"
    no-permission-permanent: "&c你没有权限使用永久处罚。"

online-yes: "&a在线"
online-no: "&c离线"
duration-permanent: "永久"
