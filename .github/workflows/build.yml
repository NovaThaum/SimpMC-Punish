name: 构建 SimpMC-Punish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建插件与网页服务
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查版本递增
        if: github.event_name == 'pull_request'
        run: python .github/scripts/check_versions.py "${{ github.event.pull_request.base.sha }}"

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 构建插件 JAR
        run: mvn -B clean package

      - name: 构建独立网页服务 JAR
        run: mvn -B -f simpmc-punish-web/pom.xml clean package

      - name: 定位构建产物
        id: artifacts
        shell: bash
        run: |
          plugin_jar=$(find target -maxdepth 1 -type f -name 'SimpMC-Punish-*.jar' ! -name 'original-*' -print -quit)
          web_jar=$(find simpmc-punish-web/target -maxdepth 1 -type f -name 'simpmc-punish-web-*.jar' ! -name 'original-*' -print -quit)
          test -n "$plugin_jar"
          test -n "$web_jar"
          echo "plugin_jar=$plugin_jar" >> "$GITHUB_OUTPUT"
          echo "web_jar=$web_jar" >> "$GITHUB_OUTPUT"

      - name: 检查插件 JAR 不包含网页服务
        shell: bash
        run: |
          if jar tf "${{ steps.artifacts.outputs.plugin_jar }}" | grep -E 'me/simpmc/simpmcpunish/web/|public/|web/|index\.html|app\.js|styles\.css'; then
            echo "插件 JAR 中仍包含网页服务文件。"
            exit 1
          fi

      - name: 上传插件 JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-Punish-plugin
          path: ${{ steps.artifacts.outputs.plugin_jar }}
          if-no-files-found: error

      - name: 上传网页服务 JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-Punish-web
          path: ${{ steps.artifacts.outputs.web_jar }}
          if-no-files-found: error
