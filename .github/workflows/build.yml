name: 构建 SimpMC-Punish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Paper 与 Velocity 插件
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查版本递增
        if: github.event_name == 'pull_request'
        run: python .github/scripts/check_versions.py "${{ github.event.pull_request.base.sha }}"

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 构建插件 JAR
        run: mvn -B clean package

      - name: 构建 Velocity JAR
        run: mvn -B -f simpmc-punish-velocity/pom.xml clean package

      - name: 定位构建产物
        id: artifacts
        shell: bash
        run: |
          plugin_jar=$(find target -maxdepth 1 -type f -name 'SimpMC-Punish-*.jar' ! -name 'original-*' -print -quit)
          velocity_jar=$(find simpmc-punish-velocity/target -maxdepth 1 -type f -name 'SimpMC-Punish-Velocity-*.jar' ! -name 'original-*' -print -quit)
          test -n "$plugin_jar"
          test -n "$velocity_jar"
          echo "plugin_jar=$plugin_jar" >> "$GITHUB_OUTPUT"
          echo "velocity_jar=$velocity_jar" >> "$GITHUB_OUTPUT"

      - name: 检查 Paper JAR 不包含 Velocity 组件
        shell: bash
        run: |
          if jar tf "${{ steps.artifacts.outputs.plugin_jar }}" | grep -E 'velocity|public/|index\.html|app\.js|styles\.css'; then
            echo "Paper JAR 中不应包含 Velocity 或网页文件。"
            exit 1
          fi

      - name: 上传插件 JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-Punish-plugin
          path: ${{ steps.artifacts.outputs.plugin_jar }}
          if-no-files-found: error

      - name: 上传 Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-Punish-velocity
          path: ${{ steps.artifacts.outputs.velocity_jar }}
          if-no-files-found: error
