name: 构建 SimpBan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建插件与网页服务
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 构建插件 JAR
        run: mvn -B clean package

      - name: 构建独立网页服务 JAR
        run: mvn -B -f simpban-web/pom.xml clean package

      - name: 检查插件 JAR 不包含网页服务
        shell: bash
        run: |
          if jar tf target/simpban-1.0.jar | grep -E 'me/simpmc/simpban/web/|public/|web/|index\.html|app\.js|styles\.css'; then
            echo "插件 JAR 中仍包含网页服务文件。"
            exit 1
          fi

      - name: 上传插件 JAR
        uses: actions/upload-artifact@v4
        with:
          name: simpban-plugin-1.0
          path: target/simpban-1.0.jar
          if-no-files-found: error

      - name: 上传网页服务 JAR
        uses: actions/upload-artifact@v4
        with:
          name: simpban-web-1.0
          path: simpban-web/target/simpban-web-1.0.jar
          if-no-files-found: error
